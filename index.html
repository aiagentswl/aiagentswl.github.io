<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robinhood Chain Top 500 Holders</title>
    <!-- Ethers.js v5 Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
        h2 { color: #111; margin-bottom: 20px; font-size: 20px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 5px; color: #333; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background-color: #00c805; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #00a304; }
        #status { margin-top: 15px; font-size: 14px; font-weight: bold; word-break: break-all; }
        .loading { color: #007bff; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
    </style>
</head>
<body>

<div class="card">
    <h2>Robinhood RPC Top 500 Holders</h2>
    
    <div class="form-group">
        <label>Alchemy RPC URL:</label>
        <input type="text" id="rpcUrl" value="https://robinhood-mainnet.g.alchemy.com/v2/-De1p3ZGJsjA0c2Bsih3t" />
    </div>

    <div class="form-group">
        <label>NFT Contract Address:</label>
        <input type="text" id="contractAddress" value="0xf08c65564eb07d880021105489552080b08e4319" />
    </div>

    <button onclick="downloadTop500Holders()">Top 500 CSV ডাউনলোড করুন</button>

    <div id="status"></div>
</div>

<script>
async function downloadTop500Holders() {
    const rpcUrl = document.getElementById('rpcUrl').value.trim();
    const contractAddress = document.getElementById('contractAddress').value.trim();
    const statusDiv = document.getElementById('status');

    if (!rpcUrl || !contractAddress) {
        alert("RPC URL এবং Contract Address দুটিই বাধ্যতামূলক!");
        return;
    }

    statusDiv.className = "loading";
    statusDiv.innerText = "Alchemy RPC দিয়ে কানেক্ট করা হচ্ছে...";

    try {
        const provider = new ethers.providers.JsonRpcProvider(rpcUrl);

        // ERC-721 Standard ABI for Transfer and Balance Check
        const abi = [
            "event Transfer(address indexed from, address indexed to, uint256 indexed tokenId)",
            "function balanceOf(address owner) view returns (uint256)"
        ];

        const contract = new ethers.Contract(contractAddress, abi, provider);

        statusDiv.innerText = "RPC থেকে Transfer Logs ডাটা নিয়ে আসা হচ্ছে...";

        // Transfer Topics তৈরি
        const filter = contract.filters.Transfer();
        
        // ব্লকচেইন থেকে সমস্ত Transfer events নিয়ে আসা
        const logs = await provider.getLogs({
            fromBlock: 0,
            toBlock: 'latest',
            address: contractAddress,
            topics: filter.topics
        });

        if (!logs || logs.length === 0) {
            statusDiv.className = "error";
            statusDiv.innerText = "কোনো Transfer Events পাওয়া যায়নি!";
            return;
        }

        statusDiv.innerText = `মোট ${logs.length} টি ট্রান্সফার থেকে ইউনিক অ্যাড্রেস বের করা হচ্ছে...`;

        // সমস্ত ইউনিক ওয়ালেট অ্যাড্রেস সংগ্রহ করা
        const candidateAddresses = new Set();
        const zeroAddress = "0x0000000000000000000000000000000000000000";

        logs.forEach(log => {
            try {
                const parsed = contract.interface.parseLog(log);
                if (parsed.args.to && parsed.args.to !== zeroAddress) {
                    candidateAddresses.add(parsed.args.to);
                }
            } catch (e) {
                // Ignore invalid logs
            }
        });

        const addressList = Array.from(candidateAddresses);
        statusDiv.innerText = `${addressList.length} টি ইউনিক অ্যাড্রেসের লাইভ NFT ব্যালেন্স চেক করা হচ্ছে...`;

        // প্রতিটি ওয়ালেটের লাইভ NFT ব্যালেন্স কল করা
        const holderBalances = [];
        let completed = 0;

        // দ্রুত স্ক্যান করার জন্য ছোট ছোট ব্যাচে রিকোয়েস্ট পাঠানো
        const batchSize = 20;
        for (let i = 0; i < addressList.length; i += batchSize) {
            const batch = addressList.slice(i, i + batchSize);
            const promises = batch.map(async (addr) => {
                try {
                    const balance = await contract.balanceOf(addr);
                    const count = balance.toNumber();
                    if (count > 0) {
                        return { address: addr, count: count };
                    }
                } catch (err) {
                    return null;
                }
            });

            const results = await Promise.all(promises);
            results.forEach(res => {
                if (res) holderBalances.push(res);
            });

            completed += batch.length;
            statusDiv.innerText = `ব্যালেন্স স্ক্যান হচ্ছে: ${completed} / ${addressList.length}...`;
        }

        if (holderBalances.length === 0) {
            statusDiv.className = "error";
            statusDiv.innerText = "কোনো একটিভ হোল্ডার খুঁজে পাওয়া যায়নি!";
            return;
        }

        // যার কাছে বেশি NFT আছে তাকে আগে রেখে সাজানো (Descending Order)
        holderBalances.sort((a, b) => b.count - a.count);

        // শীর্ষ ৫০০ জন নেওয়া
        const top500 = holderBalances.slice(0, 500);

        // CSV ডাটা তৈরি
        let csvContent = "Wallet Address,NFT Balance\n";
        top500.forEach(item => {
            csvContent += `"${item.address}",${item.count}\n`;
        });

        // CSV ফাইল ডাউনলোড
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `robinhood_rpc_top_500_holders_${contractAddress}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        statusDiv.className = "success";
        statusDiv.innerText = `সফলভাবে টপ ${top500.length} জন হোল্ডারের CSV ডাউনলোড হয়েছে!`;

    } catch (error) {
        console.error(error);
        statusDiv.className = "error";
        statusDiv.innerText = "RPC Error: " + error.message;
    }
}
</script>

</body>
</html>
