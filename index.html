<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robinhood Chain Top 500 Holders</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 600px; text-align: center; }
        h2 { color: #111; margin-bottom: 20px; font-size: 20px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 5px; color: #333; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background-color: #00c805; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #00a304; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #status { margin-top: 15px; font-size: 14px; font-weight: bold; word-break: break-all; }
        .loading { color: #007bff; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        .info { color: #6c757d; }
        #progressBar { width: 100%; height: 8px; background: #e9ecef; border-radius: 4px; margin-top: 10px; overflow: hidden; display: none; }
        #progressBar div { height: 100%; background: #007bff; border-radius: 4px; transition: width 0.3s; }
        .stats { font-size: 12px; color: #6c757d; margin-top: 8px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Robinhood RPC Top 500 Holders</h2>
    
    <div class="form-group">
        <label>Alchemy RPC URL:</label>
        <input type="text" id="rpcUrl" value="https://robinhood-mainnet.g.alchemy.com/v2/_v3B3LAcaa_AELEu9S2li" />
    </div>

    <div class="form-group">
        <label>NFT Contract Address:</label>
        <input type="text" id="contractAddress" value="0x68e5a6aaf2503940f0337243063ab8f4da6bedec" />
    </div>

    <div class="form-group">
        <label>ব্লক রেঞ্জ (Free Tier এ ১০ ব্লক):</label>
        <input type="number" id="blockRange" value="10" min="1" max="10" />
        <small style="color: #6c757d;">Alchemy Free Tier এ সর্বোচ্চ ১০ ব্লক</small>
    </div>

    <button onclick="downloadTop500Holders()" id="downloadBtn">Top 500 CSV ডাউনলোড করুন</button>

    <div id="progressBar"><div id="progressFill" style="width: 0%;"></div></div>
    <div id="status"></div>
</div>

<script>
async function downloadTop500Holders() {
    const rpcUrl = document.getElementById('rpcUrl').value.trim();
    const contractAddress = document.getElementById('contractAddress').value.trim();
    const blockRange = parseInt(document.getElementById('blockRange').value) || 10;
    const statusDiv = document.getElementById('status');
    const downloadBtn = document.getElementById('downloadBtn');
    const progressFill = document.getElementById('progressFill');
    const progressBar = document.getElementById('progressBar');

    if (!rpcUrl || !contractAddress) {
        alert("RPC URL এবং Contract Address দুটিই বাধ্যতামূলক!");
        return;
    }

    downloadBtn.disabled = true;
    progressBar.style.display = 'block';
    progressFill.style.width = '0%';

    try {
        statusDiv.className = "loading";
        statusDiv.innerText = "⏳ RPC এর সাথে কানেক্ট হচ্ছে...";

        const provider = new ethers.providers.JsonRpcProvider(rpcUrl);
        const currentBlock = await provider.getBlockNumber();
        
        statusDiv.innerText = `✅ সংযুক্ত! বর্তমান ব্লক: ${currentBlock.toLocaleString()}`;

        const abi = [
            "event Transfer(address indexed from, address indexed to, uint256 indexed tokenId)",
            "function balanceOf(address owner) view returns (uint256)"
        ];

        const contract = new ethers.Contract(contractAddress, abi, provider);

        // সমস্ত ইউনিক অ্যাড্রেস সংগ্রহ করার জন্য
        const allAddresses = new Set();
        const zeroAddress = "0x0000000000000000000000000000000000000000";
        
        // Free Tier limitation: 10 blocks per request
        const maxBlockRange = Math.min(blockRange, 10);
        
        // Start from last 10,000 blocks or contract creation (যেটা ছোট)
        const startBlock = Math.max(0, currentBlock - 10000);
        let fromBlock = startBlock;
        let totalLogs = 0;
        let batchCount = 0;

        statusDiv.innerText = `🔍 ব্লক স্ক্যান করা হচ্ছে (${maxBlockRange} ব্লক/ব্যাচ)...`;

        // ব্যাচে ব্যাচে স্ক্যান করা
        while (fromBlock <= currentBlock) {
            const toBlock = Math.min(fromBlock + maxBlockRange - 1, currentBlock);
            
            try {
                const logs = await provider.getLogs({
                    fromBlock: fromBlock,
                    toBlock: toBlock,
                    address: contractAddress,
                    topics: ["0xddf252ad1be2c89b69c2b068f373d8a952ba7f163c4a11628f55a4df523b3ef"]
                });

                if (logs.length > 0) {
                    totalLogs += logs.length;
                    
                    // Transfer ইভেন্ট থেকে অ্যাড্রেস বের করা
                    for (const log of logs) {
                        try {
                            // টপিক থেকে সরাসরি অ্যাড্রেস বের করা
                            const toAddress = "0x" + log.topics[2].slice(26);
                            if (toAddress && toAddress !== zeroAddress) {
                                allAddresses.add(toAddress);
                            }
                        } catch (e) {
                            // Skip invalid logs
                        }
                    }
                }

                batchCount++;
                const progress = Math.min(100, ((fromBlock - startBlock) / (currentBlock - startBlock)) * 100);
                progressFill.style.width = progress + '%';
                
                statusDiv.innerText = `⏳ স্ক্যানিং: ব্লক ${fromBlock.toLocaleString()} - ${toBlock.toLocaleString()} (${Math.round(progress)}%) | লগ পেয়েছি: ${totalLogs.toLocaleString()}`;

                fromBlock = toBlock + 1;

                // রেট লিমিট এভয়েড করতে সামান্য delay
                if (batchCount % 5 === 0) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                }

            } catch (error) {
                console.warn(`Batch ${batchCount} failed:`, error);
                // এরর হলে এক ব্লক এগিয়ে যাও
                fromBlock = fromBlock + 1;
                if (error.message && error.message.includes('rate limit')) {
                    await new Promise(resolve => setTimeout(resolve, 2000));
                }
            }
        }

        const addressList = Array.from(allAddresses);
        
        if (addressList.length === 0) {
            statusDiv.className = "error";
            statusDiv.innerText = "❌ কোনো ইউনিক অ্যাড্রেস পাওয়া যায়নি!";
            return;
        }

        statusDiv.innerText = `👤 ${addressList.length.toLocaleString()} টি ইউনিক অ্যাড্রেস পেয়েছি! ব্যালেন্স চেক করা হচ্ছে...`;

        // ব্যালেন্স চেক করা
        const holderBalances = [];
        const batchSize = 5;
        let processed = 0;

        for (let i = 0; i < addressList.length; i += batchSize) {
            const batch = addressList.slice(i, i + batchSize);
            const promises = batch.map(async (addr) => {
                try {
                    const balance = await contract.balanceOf(addr);
                    const count = balance.toNumber();
                    if (count > 0) {
                        return { address: addr, count: count };
                    }
                    return null;
                } catch (err) {
                    return null;
                }
            });

            const results = await Promise.all(promises);
            results.forEach(res => {
                if (res) holderBalances.push(res);
            });

            processed += batch.length;
            const progress = Math.min(100, 60 + ((processed / addressList.length) * 40));
            progressFill.style.width = progress + '%';
            statusDiv.innerText = `⏳ ব্যালেন্স চেক: ${processed.toLocaleString()} / ${addressList.length.toLocaleString()}`;
        }

        if (holderBalances.length === 0) {
            statusDiv.className = "error";
            statusDiv.innerText = "❌ কোনো একটিভ হোল্ডার খুঁজে পাওয়া যায়নি!";
            return;
        }

        // সাজানো (Descending)
        holderBalances.sort((a, b) => b.count - a.count);
        const top500 = holderBalances.slice(0, 500);

        // CSV তৈরি
        let csvContent = "Wallet Address,NFT Balance\n";
        top500.forEach(item => {
            csvContent += `"${item.address}",${item.count}\n`;
        });

        // ডাউনলোড
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `robinhood_top_500_holders_${contractAddress.slice(0, 10)}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        statusDiv.className = "success";
        statusDiv.innerText = `✅ সফল! টপ ${top500.length} জন হোল্ডারের CSV ডাউনলোড হয়েছে!`;
        progressFill.style.width = '100%';

    } catch (error) {
        console.error('Error:', error);
        
        let errorMsg = error.message || 'অজানা এরর!';
        
        if (errorMsg.includes('block range')) {
            errorMsg = '⚠️ ব্লক রেঞ্জ খুব বড়! Free Tier এ ১০ ব্লক পর্যন্ত অনুমোদিত।';
        } else if (errorMsg.includes('rate limit')) {
            errorMsg = '⏳ রেট লিমিট অতিক্রম! ২ সেকেন্ড পর আবার চেষ্টা করছি...';
            // Retry logic
            await new Promise(resolve => setTimeout(resolve, 3000));
            // Recursive call
            return downloadTop500Holders();
        } else if (errorMsg.includes('Invalid API key')) {
            errorMsg = '❌ API Key সঠিক নয়! Alchemy থেকে নতুন Key নিন।';
        } else if (errorMsg.includes('network')) {
            errorMsg = '🌐 নেটওয়ার্ক সমস্যা! ইন্টারনেট কানেকশন চেক করুন।';
        }
        
        statusDiv.className = "error";
        statusDiv.innerText = `❌ ${errorMsg}`;
        
        // আরও বিস্তারিত জানান
        if (error.data) {
            console.log('Error details:', error.data);
        }
        
    } finally {
        downloadBtn.disabled = false;
        setTimeout(() => {
            progressBar.style.display = 'none';
        }, 5000);
    }
}
</script>

</body>
</html>
