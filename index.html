<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robinhood Chain NFT Top Holders Downloader</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 480px; text-align: center; }
        h2 { color: #111; margin-bottom: 20px; font-size: 20px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        button { width: 95%; padding: 12px; background-color: #00c805; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #00a304; }
        #status { margin-top: 15px; font-size: 14px; font-weight: bold; }
        .loading { color: #007bff; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
    </style>
</head>
<body>

<div class="card">
    <h2>Robinhood Chain NFT Top Holders Downloader</h2>
    
    <label style="display:block; text-align:left; margin-left: 15px; font-size: 13px; font-weight: bold;">NFT Contract Address:</label>
    <input type="text" id="contractAddress" value="0xf08c65564eb07d880021105489552080b08e4319" placeholder="0x..." />

    <button onclick="downloadCSV()">Top 500 CSV ডাউনলোড করুন</button>

    <div id="status"></div>
</div>

<script>
async function downloadCSV() {
    const contractAddress = document.getElementById('contractAddress').value.trim();
    const statusDiv = document.getElementById('status');

    if (!contractAddress) {
        alert("Contract Address দিন!");
        return;
    }

    statusDiv.className = "loading";
    statusDiv.innerText = "Robinhood Chain থেকে ডাটা আনা হচ্ছে...";

    // Blockscout API URL for Robinhood Chain
    const apiUrl = `https://robinhoodchain.blockscout.com/api/v2/tokens/${contractAddress}/counters`;
    const holdersUrl = `https://robinhoodchain.blockscout.com/api/v2/tokens/${contractAddress}/holders`;

    try {
        const response = await fetch(holdersUrl);
        if (!response.ok) throw new Error("কন্ট্রাক্ট পাওয়া যায়নি অথবা নেটওয়ার্ক সমস্যা!");

        const data = await response.json();
        const items = data.items || [];

        if (items.length === 0) {
            statusDiv.className = "error";
            statusDiv.innerText = "কোনো হোল্ডার ডাটা পাওয়া যায়নি!";
            return;
        }

        // হোল্ডারদের তালিকা ফিল্টার
        let holders = items.map(item => {
            return {
                address: item.address.hash,
                value: item.value
            };
        });

        // টপ ৫০০ নেওয়া
        const top500 = holders.slice(0, 500);

        // CSV ফর্মেট তৈরি
        let csvContent = "Wallet Address,NFT Count\n";
        top500.forEach(row => {
            csvContent += `"${row.address}",${row.value}\n`;
        });

        // CSV ডাউনলোড
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `robinhood_holders_${contractAddress}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        statusDiv.className = "success";
        statusDiv.innerText = `সফলভাবে টপ ${top500.length} জনের CSV ডাউনলোড হয়েছে!`;

    } catch (error) {
        console.error(error);
        statusDiv.className = "error";
        statusDiv.innerText = "ত্রুটি: " + error.message;
    }
}
</script>

</body>
</html>
