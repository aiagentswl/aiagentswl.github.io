<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top 500 NFT Holders</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
        h2 { color: #111; margin-bottom: 20px; font-size: 20px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 5px; color: #333; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background-color: #00c805; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #00a304; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #status { margin-top: 15px; font-size: 14px; font-weight: bold; word-break: break-all; }
        .loading { color: #007bff; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
    </style>
</head>
<body>

<div class="card">
    <h2>Top 500 NFT Holders</h2>
    
    <div class="form-group">
        <label>RPC URL:</label>
        <input type="text" id="rpcUrl" value="https://robinhood-mainnet.g.alchemy.com/v2/_v3B3LAcaa_AELEu9S2li" />
    </div>

    <div class="form-group">
        <label>NFT Contract Address:</label>
        <input type="text" id="contractAddress" value="0x68e5a6aaf2503940f0337243063ab8f4da6bedec" />
    </div>

    <button onclick="getTopHolders()" id="downloadBtn">Top 500 Holders ডাউনলোড করুন</button>

    <div id="status"></div>
</div>

<script>
async function getTopHolders() {
    const rpcUrl = document.getElementById('rpcUrl').value.trim();
    const contractAddress = document.getElementById('contractAddress').value.trim();
    const statusDiv = document.getElementById('status');
    const downloadBtn = document.getElementById('downloadBtn');

    if (!rpcUrl || !contractAddress) {
        alert("RPC URL এবং Contract Address দিন!");
        return;
    }

    downloadBtn.disabled = true;
    statusDiv.className = "loading";
    statusDiv.innerText = "⏳ সংযোগ স্থাপন করা হচ্ছে...";

    try {
        const provider = new ethers.providers.JsonRpcProvider(rpcUrl);
        const currentBlock = await provider.getBlockNumber();
        
        statusDiv.innerText = `📊 বর্তমান ব্লক: ${currentBlock.toLocaleString()}`;

        // শুধু Transfer ইভেন্টের জন্য ABI
        const abi = [
            "event Transfer(address indexed from, address indexed to, uint256 indexed tokenId)",
            "function balanceOf(address owner) view returns (uint256)"
        ];

        const contract = new ethers.Contract(contractAddress, abi, provider);

        // গত ১০,০০০ ব্লক থেকে Transfer লগ আনা (Alchemy Free Tier এর জন্য)
        const fromBlock = currentBlock - 10000;
        
        statusDiv.innerText = `🔍 ${fromBlock.toLocaleString()} থেকে ${currentBlock.toLocaleString()} ব্লক স্ক্যান করা হচ্ছে...`;

        const filter = contract.filters.Transfer();
        const logs = await provider.getLogs({
            fromBlock: fromBlock,
            toBlock: currentBlock,
            address: contractAddress,
            topics: filter.topics
        });

        statusDiv.innerText = `📝 ${logs.length.toLocaleString()} টি Transfer Event পাওয়া গেছে!`;

        if (logs.length === 0) {
            statusDiv.className = "error";
            statusDiv.innerText = "❌ কোনো Transfer Events পাওয়া যায়নি!";
            return;
        }

        // ইউনিক অ্যাড্রেস সংগ্রহ
        const uniqueAddresses = new Set();
        const zeroAddress = "0x0000000000000000000000000000000000000000";

        logs.forEach(log => {
            try {
                const parsed = contract.interface.parseLog(log);
                const to = parsed.args.to;
                if (to && to !== zeroAddress) {
                    uniqueAddresses.add(to);
                }
            } catch (e) {
                // Invalid log skip
            }
        });

        const addressList = Array.from(uniqueAddresses);
        
        if (addressList.length === 0) {
            statusDiv.className = "error";
            statusDiv.innerText = "❌ কোনো ইউনিক অ্যাড্রেস পাওয়া যায়নি!";
            return;
        }

        statusDiv.innerText = `👤 ${addressList.length.toLocaleString()} টি ইউনিক অ্যাড্রেস। ব্যালেন্স চেক করা হচ্ছে...`;

        // ব্যালেন্স চেক (সবগুলো)
        const holders = [];
        let processed = 0;

        for (const addr of addressList) {
            try {
                const balance = await contract.balanceOf(addr);
                const count = balance.toNumber();
                if (count > 0) {
                    holders.push({ address: addr, balance: count });
                }
            } catch (e) {
                // Skip
            }
            
            processed++;
            if (processed % 50 === 0) {
                statusDiv.innerText = `⏳ ব্যালেন্স চেক: ${processed}/${addressList.length}`;
            }
        }

        if (holders.length === 0) {
            statusDiv.className = "error";
            statusDiv.innerText = "❌ কোনো হোল্ডার খুঁজে পাওয়া যায়নি!";
            return;
        }

        // সাজানো (যার বেশি NFT তার আগে)
        holders.sort((a, b) => b.balance - a.balance);

        // টপ ৫০০
        const top500 = holders.slice(0, 500);

        // CSV তৈরি
        let csv = "Wallet Address,NFT Balance\n";
        top500.forEach(h => {
            csv += `"${h.address}",${h.balance}\n`;
        });

        // ডাউনলোড
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `top_500_holders_${contractAddress.slice(0, 8)}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        statusDiv.className = "success";
        statusDiv.innerText = `✅ সফল! ${top500.length} জন হোল্ডারের CSV ডাউনলোড হয়েছে!`;

    } catch (error) {
        console.error(error);
        statusDiv.className = "error";
        
        let msg = error.message || 'অজানা এরর!';
        if (msg.includes('block range')) {
            msg = '⚠️ ব্লক রেঞ্জ খুব বড়! Free Tier এ ১০ ব্লক পর্যন্ত অনুমোদিত।';
        } else if (msg.includes('Invalid API key')) {
            msg = '❌ API Key সঠিক নয়!';
        }
        
        statusDiv.innerText = `❌ ${msg}`;
    } finally {
        downloadBtn.disabled = false;
    }
}
</script>

</body>
</html>
